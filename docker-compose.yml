name: tc-attendance-platform

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tc-attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: tc_attendance
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
