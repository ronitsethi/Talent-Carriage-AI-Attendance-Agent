name: talentcarriageaiattendanceagent

services:
  db:
    image: postgres:16-alpine
    container_name: attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
